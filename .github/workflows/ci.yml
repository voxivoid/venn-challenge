name: CI

on:
  pull_request:
  push:
    branches: [main]

# A new push to the same PR or branch cancels the run it replaces.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Lint, test and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Format
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      # With the React Compiler on, like production.
      - name: Test
        run: npm test

      # Compiler off (its memo branches skew coverage); fails under the thresholds.
      - name: Coverage
        run: npm run test:coverage

      - name: Build
        run: npm run build

      - name: Build Storybook
        run: npm run build-storybook
